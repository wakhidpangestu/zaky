name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pasang dependensi
        run: npm ci
      - name: Jalankan seluruh suite uji
        run: npm run test:all
      - name: Build produksi
        run: npm run build
